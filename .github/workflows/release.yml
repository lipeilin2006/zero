name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    name: server (linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p zero-server -p zero
      - name: 打包
        run: |
          mkdir -p dist
          cp target/release/zero-server target/release/zero dist/
          tar -czf "zero-server-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" -C dist zero-server zero
      - uses: softprops/action-gh-release@v2
        with:
          files: zero-server-*.tar.gz
          generate_release_notes: true
          body: |
            服务端二进制（Linux x86_64）和客户端安装包见附件。

            服务端一键部署：
            ```bash
            tar -xzf zero-server-*.tar.gz
            sudo packaging/install-server.sh --bin ./zero-server
            ```
            或直接下载 `install-server.sh` 后配合二进制使用。

  client:
    name: client (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zero-client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: zero-client
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: zero-client
          tagName: ${{ github.ref_name }}
          releaseName: "Zero ${{ github.ref_name }}"
          releaseBody: |
            服务端二进制和客户端安装包见附件。
            服务端部署见仓库 packaging/README.md。
          releaseDraft: false
          prerelease: false

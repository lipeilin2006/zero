name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cleanup:
    name: 清理旧版本
    runs-on: ubuntu-22.04
    steps:
      - name: 删除除当前 tag 之外的 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ github.ref_name }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$KEEP" ]; then
              echo "删除旧版本：$tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

  server:
    name: server (${{ matrix.arch }} linux)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - name: 交叉编译
        run: cross build --release --target ${{ matrix.target }} -p zero-server -p zero
      - name: 打包
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/zero-server" dist/
          cp "target/${{ matrix.target }}/release/zero" dist/
          cp install-server.sh packaging/README.md dist/
          tar -czf "zero-server-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux.tar.gz" \
            -C dist zero-server zero install-server.sh README.md
      - name: 上传 release 附件
        uses: softprops/action-gh-release@v2
        with:
          files: zero-server-*.tar.gz
          generate_release_notes: true

  install-script:
    name: 一键部署脚本
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 上传 install-server.sh
        uses: softprops/action-gh-release@v2
        with:
          files: install-server.sh

  client:
    name: client (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zero-client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux 依赖
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: zero-client
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: zero-client
          tagName: ${{ github.ref_name }}
          releaseName: "Zero ${{ github.ref_name }}"
          releaseBody: |
            服务端和客户端按平台/架构分开发布：

            - 服务端：`zero-server-<版本>-<架构>-linux.tar.gz`（x86_64 / aarch64）
            - 客户端：下面的 deb / rpm / AppImage / dmg / exe / msi

            一键部署（自动识别架构、自动下载服务端）：
            ```bash
            curl -fsSL https://raw.githubusercontent.com/lipeilin2006/zero/main/install-server.sh | sudo bash
            ```
            详细说明见仓库 README / packaging/README.md。
          releaseDraft: false
          prerelease: false
